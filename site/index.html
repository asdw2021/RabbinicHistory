<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Rabbinic History Map</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#252f2b" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://server.arcgisonline.com" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="static/css/styles.css?v=android1" />
</head>

<body>
  <div id="map"></div>
  <div id="year">Loading...</div>

  <div id="yearNav">
    <button id="prevYear">⬅ Prev</button>
    <input id="jumpYearInput" type="number" inputmode="numeric" placeholder="Year" aria-label="Jump to year" />
    <button id="jumpYearButton">Jump</button>
    <button id="nextYear">Next ➡</button>
  </div>

  <input id="slider" type="range" min="0" max="0" step="1" value="0" />

  <div id="rangeBox">
    From <input type="number" id="fromYear" />
    to <input type="number" id="toYear" />
    <button id="applyRange">Set</button>
  </div>

  <button id="mobileControlsToggle" type="button" aria-expanded="false" aria-controls="rightControls">
    ☰ Map options
  </button>

  <div id="rightControls" aria-label="Map options">
  <div id="filters">
    <label><input type="checkbox" id="toggleRabbis" checked /> Rabbis</label>
    <label><input type="checkbox" id="toggleShuls" checked /> Shuls</label>
    <label><input type="checkbox" id="togglePersonalities" checked /> Personalities</label>
    <label><input type="checkbox" id="toggleBattles" checked /> Battles</label>
    <label><input type="checkbox" id="toggleTemporaryRegions" checked /> Regions</label>
    <label><input type="checkbox" id="toggleEvents" checked /> Events</label>
    <label><input type="checkbox" id="toggleSefarim" checked /> Sefarim</label>
    <label><input type="checkbox" id="toggleRabbiEvents" /> Pop Ups</label>
    <label><input type="checkbox" id="toggleDemographics" /> Demographics</label>
  </div>

  <div id="rabbiSearchBox">
    <input
      id="rabbiSearchInput"
      list="rabbiSearchList"
      placeholder="Search rabbi..."
    />

    <datalist id="rabbiSearchList"></datalist>

    <button id="rabbiSearchButton">Go</button>
  </div>

  <div id="seferSearchBox">
    <input id="seferSearchInput" list="seferSearchList" placeholder="Search sefer..." />
    <datalist id="seferSearchList"></datalist>
    <button id="seferSearchButton">Go</button>
  </div>

  <div id="sizeControl">
    <label>
      Icon Size
      <input
        type="range"
        id="rabbiSizeSlider"
        min="0.25"
        max="1.5"
        step="0.05"
        value="0.65"
      />
    </label>

    <label style="display:block;margin-top:6px;">
      <input type="checkbox" id="toggleRabbiNames" checked />
      Show Name
    </label>

    <label style="display:block;margin-top:6px;">
      <input type="checkbox" id="toggleRabbiPictures" checked />
      Show Icon
    </label>
  </div>
  </div>

  <!-- Rabbi Video / Story Mode -->
  <div id="storyControl">
    <div id="storyHeader">
      <span>Follow a Story</span>
      <span id="storyDropdownArrow">▾</span>
    </div>

    <div id="storyBody">
      <input id="storyRabbiSelect" list="storyRabbiOptions" placeholder="Type a name..." autocomplete="off" />
      <datalist id="storyRabbiOptions"></datalist>

      <select id="storySpeed">
        <option value="6000">Slow</option>
        <option value="3500" selected>Normal</option>
        <option value="1800">Fast</option>
      </select>

      <div id="storyButtons">
        <button id="playStory">▶ Play</button>
        <button id="pauseStory">⏸ Pause</button>
        <button id="stopStory">⏹ Stop</button>
      </div>
    </div>
  </div>

  <div id="storyPanel">
    <button id="storyPanelClose">×</button>
    <h2 id="storyTitle">Rabbi Story</h2>
    <h3 id="storyYear"></h3>
    <div id="storyText"></div>
  </div>
<div id="storyDetailBox">
  <button id="storyDetailClose">×</button>
  <img id="storyDetailImage" />
  <div id="storyDetailExtract"></div>
  <button id="storyReadMore">Read more</button>
  <div id="storyMoreText"></div>
</div>
  <div id="eventPanel">
    <button id="eventToggle">Events ▾</button>
    <div id="eventBox"></div>
  </div>

  <div id="seferDetailPanel" aria-hidden="true">
    <button id="seferDetailClose" aria-label="Close book details">×</button>
    <h2 id="seferDetailTitle">Sefer details</h2>
    <div id="seferDetailSections"></div>
  </div>

  <div id="demographicEditor">
    <button id="demographicEditorToggle">Demographic Data</button>
    <div id="demographicEditorBody">
      <div class="demographic-grid">
        <label>Place<input id="demographicPlace" placeholder="e.g. Baghdad" /></label>
        <label>Statistic<input id="demographicLabel" placeholder="e.g. Jewish population" /></label>
        <label>Value<input id="demographicValue" type="number" min="0" /></label>
        <label>Total (optional)<input id="demographicTotal" type="number" min="0" /></label>
        <label>Start year<input id="demographicStart" type="number" /></label>
        <label>End year<input id="demographicEnd" type="number" /></label>
        <label>Latitude<input id="demographicLat" type="number" step="any" /></label>
        <label>Longitude<input id="demographicLng" type="number" step="any" /></label>
        <label>Colour<input id="demographicColor" type="color" value="#3568a8" /></label>
      </div>
      <div class="demographic-actions">
        <button id="demographicUseCenter">Use map centre</button>
        <button id="demographicSave">Add statistic</button>
        <button id="demographicExport">Export JSON</button>
      </div>
      <div id="demographicMessage"></div>
      <div id="demographicEntries"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="static/js/app.js?v=android1"></script>
</body>
</html>
